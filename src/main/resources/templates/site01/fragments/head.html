<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="head" th:with="seo=${seo != null ? seo : @seoService.fallback()}">

    <!-- Studiodomino srl Basic Head -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta http-equiv="x-ua-compatible" content="IE=edge"/>

    <title th:text="${seo.title}">Home</title>
    <meta name="keywords" th:content="${config != null and config.sito != null ? config.sito.keywords : ''}"/>
    <meta name="description" th:content="${seo.description}"/>
    <link rel="canonical" th:href="${seo.canonicalUrl}"/>
    <meta name="robots" th:content="${seo.indexable} ? 'index, follow' : 'noindex, follow'"/>
    <meta name="author" content="Studiodomino srl - Potenza"/>
    <meta name="DC.Description" th:content="${seo.title}"/>

    <!-- Open Graph: Facebook, LinkedIn, WhatsApp, Telegram -->
    <meta property="og:type"        th:content="${seo.type}"/>
    <meta property="og:title"       th:content="${seo.title}"/>
    <meta property="og:description" th:content="${seo.description}"/>
    <meta property="og:image"       th:content="${seo.image}"/>
    <meta property="og:image:alt"   th:content="${seo.imageAlt}"/>
    <meta property="og:url"         th:content="${seo.canonicalUrl}"/>
    <meta property="og:site_name"   th:content="${seo.siteName}"/>
    <meta property="og:locale"      content="it_IT"/>

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image"/>
    <meta name="twitter:title"       th:content="${seo.title}"/>
    <meta name="twitter:description" th:content="${seo.description}"/>
    <meta name="twitter:image"       th:content="${seo.image}"/>

    <!-- Mobile -->
    <meta name="HandheldFriendly" content="true"/>
    <meta name="format-detection" content="telephone=no"/>

    <!-- Favicons -->
    <link rel="icon" type="image/png"
          th:href="@{/site01/images/as forma.png}"/>
    <link rel="shortcut icon" type="image/png"
          th:href="@{/site01/images/as forma.png}"/>
    <link rel="apple-touch-icon"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon.png'}"/>
    <link rel="apple-touch-icon" sizes="72x72"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-72x72.png'}"/>
    <link rel="apple-touch-icon" sizes="114x114"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-114x114.png'}"/>
    <link rel="apple-touch-icon" sizes="144x144"
          th:href="@{'/' + ${config.sito.path2} + '/assets/apple-touch-icon-144x144.png'}"/>

    <!-- CSS (Educeet) -->
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/bootstrap.min.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/font-awesome-pro.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/swiper-bundle.min.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/slick.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/nice-select.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/magnific-popup.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/custom-animation.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/spacing.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/main.css'}">
    <link rel="stylesheet" th:href="@{'/' + ${config.sito.path2} + '/assets/css/educeet-custom.css'}">

    <style>
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }
        #google_translate_element { display: none; }
    </style>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- JSON-LD: dati struttura organizzazione (Google Business, rich snippet) -->
    <script type="application/ld+json" th:if="${orgJsonLd != null}" th:utext="${orgJsonLd}"></script>

    <!-- JSON-LD: breadcrumb della pagina corrente -->
    <script type="application/ld+json" th:if="${breadcrumbJsonLd != null}" th:utext="${breadcrumbJsonLd}"></script>

</th:block>
