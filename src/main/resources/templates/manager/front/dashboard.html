<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{manager/layout/template}">

<head>
    <title>Dashboard Amministrazione</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Welcome Banner -->
    <div class="row">
        <div class="col-12">
            <div class="card welcome-banner bg-blue-800">
                <div class="card-body">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="p-4">
                                <h2 class="text-white">Benvenuto, <span th:text="${config.amministratore?.nomeCompleto}">Admin</span>!</h2>
                                <p class="text-white">Pannello di amministrazione JPlatform
                                    Studiodomino</p>
                                <p class="text-white-50">
                                    Ultimo accesso: <span th:text="${config.amministratore?.dataultimoaccesso}">-</span>
                                </p>
                            </div>
                        </div>
                        <div class="col-sm-6 text-center">
                            <div class="img-welcome-banner">
                                <img th:src="@{/manager/assets/images/widget/welcome-banner.png}"
                                     alt="img"
                                     class="img-fluid" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Stats Cards =====
             Ogni riga crea una card usando il modello "statCard" che sta in fondo al file.
             Parametri: titolo, icona, colore Bootstrap, dati (dal controller), colore del grafico -->
        <th:block th:replace="~{manager/front/dashboard :: statCard('Utenti registrati', 'ti ti-users',     'primary', ${stats['utenti']},    '#4680FF')}"></th:block>
        <th:block th:replace="~{manager/front/dashboard :: statCard('Contenuti',        'ti ti-file-text', 'warning', ${stats['contenuti']}, '#E58A00')}"></th:block>
        <th:block th:replace="~{manager/front/dashboard :: statCard('Sezioni',          'ti ti-folders',   'success', ${stats['sezioni']},   '#2CA87F')}"></th:block>
        <th:block th:replace="~{manager/front/dashboard :: statCard('Allegati',         'ti ti-paperclip', 'danger',  ${stats['allegati']},  '#DC2626')}"></th:block>

        <!-- Quick Actions -->
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5>Azioni rapide</h5>
                </div>
                <div class="card-body">
                    <div class="btn-group" role="group">

                        <!-- Nuovo contenuto -->
                        <a th:href="@{/admin/contenuti/new}" class="btn btn-primary">
                            <i class="ti ti-plus me-2"></i> Nuovo contenuto
                        </a>

                        <!-- Nuovo utente -->
                        <a th:href="@{/admin/crm/utenti/new}" class="btn btn-success">
                            <i class="ti ti-user-plus me-2"></i> Nuovo utente
                        </a>

                        <!-- Impostazioni -->
                        <a th:href="@{/admin/impostazioni/configurazioni}" class="btn btn-info">
                            <i class="ti ti-settings me-2"></i> Impostazioni
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </div>

</div>


<!-- =====================================================================
     MODELLO DELLA CARD STATISTICA
     Sta fuori da layout:fragment="content", quindi da solo non viene mostrato:
     lo usano le 4 righe th:replace qui sopra.
       stat.totale      → numero grande
       stat.ultimi30gg  → "+N in 30 gg"
       stat.serie       → "3,0,5,..." (12 mesi) per il grafico a barre
     ===================================================================== -->
<div class="col-md-6 col-xxl-3" th:fragment="statCard(titolo, icona, colore, stat, coloreHex)">
    <div class="card">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <div class="flex-shrink-0">
                    <div th:class="'avtar avtar-s bg-light-' + ${colore}">
                        <i th:class="${icona} + ' f-20'"></i>
                    </div>
                </div>
                <div class="flex-grow-1 ms-3">
                    <h6 class="mb-0" th:text="${titolo}">Titolo</h6>
                </div>
            </div>
            <div class="bg-body p-3 mt-3 rounded">
                <div class="mt-3 row align-items-center">
                    <div class="col-7">
                        <!-- il grafico lo disegna lo script in fondo leggendo data-serie -->
                        <div class="dashboard-spark"
                             th:attr="data-serie=${stat != null ? stat.serie : ''}, data-colore=${coloreHex}"></div>
                    </div>
                    <div class="col-5">
                        <h5 class="mb-1"
                            th:text="${stat != null ? #numbers.formatInteger(stat.totale, 1, 'POINT') : '-'}">0</h5>
                        <p th:class="${stat != null and stat.ultimi30gg > 0} ? 'mb-0 small text-' + ${colore} : 'mb-0 small text-muted'">
                            <i class="ti ti-arrow-up-right" th:if="${stat != null and stat.ultimi30gg > 0}"></i>
                            <span th:text="${stat != null and stat.ultimi30gg > 0} ? '+' + ${stat.ultimi30gg} + ' in 30 gg' : 'nessuno in 30 gg'"></span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Extra CSS -->
<th:block layout:fragment="extra-css">
    <!-- ApexCharts CSS se necessario -->
</th:block>

<!-- Extra JS -->
<th:block layout:fragment="extra-js">
    <!-- ApexCharts -->
    <script th:src="@{/manager/assets/js/plugins/apexcharts.min.js}"></script>

    <!-- Mini grafici a barre delle card: dati presi da data-serie (12 mesi, dal più vecchio) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // etichette dei 12 mesi per il tooltip (es. "dic 25", "gen 26", ...)
            var mesi = [];
            var d = new Date();
            d.setDate(1);
            d.setMonth(d.getMonth() - 11);
            for (var i = 0; i < 12; i++) {
                mesi.push(d.toLocaleDateString('it-IT', { month: 'short', year: '2-digit' }));
                d.setMonth(d.getMonth() + 1);
            }

            document.querySelectorAll('.dashboard-spark').forEach(function (el) {
                var serie = (el.dataset.serie || '').split(',').filter(String).map(Number);
                if (!serie.length) return;

                new ApexCharts(el, {
                    chart: { type: 'bar', height: 50, sparkline: { enabled: true } },
                    colors: [el.dataset.colore || '#4680FF'],
                    plotOptions: { bar: { borderRadius: 2, columnWidth: '80%' } },
                    series: [{ name: '', data: serie }],
                    xaxis: { categories: mesi },
                    tooltip: {
                        x: { show: true },
                        y: { title: { formatter: function () { return ''; } } },
                        marker: { show: false }
                    }
                }).render();
            });
        });
    </script>
</th:block>

</body>
</html>
